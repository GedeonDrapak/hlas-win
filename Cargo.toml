[package]
name = "hlas"
version = "0.1.0"
edition = "2021"
description = "Ultra-minimal dictation for Windows. Hold a key, speak, release."
authors = ["Gedeon Drapak"]
license = "MIT"
repository = "https://github.com/GedeonDrapak/hlas-win"

[[bin]]
name = "hlas"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
# Audio capture (WASAPI backend on Windows)
cpal = "0.15"
# Local Whisper (bundles whisper.cpp; build.rs picks the GPU/CPU backend)
whisper-rs = { version = "0.14", default-features = false }
# Tray icon + menu
tray-icon = "0.19"
# Native Win32 GUI for the settings window (no webview, tiny RAM)
native-windows-gui = "1.0"
native-windows-derive = "1.0"
# Clipboard for the inject-via-paste path
arboard = "3.4"
# Credential Manager storage for API keys
keyring = "3"
# Cloud engines
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Paths, logging, misc
dirs = "5"
anyhow = "1"
log = "0.4"
simplelog = "0.12"
once_cell = "1"
crossbeam-channel = "0.5"
# Resampling captured audio to 16 kHz mono
rubato = "0.16"
# Registry access for launch-at-login (HKCU Run key)
winreg = "0.52"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[build-dependencies]
embed-resource = "2.4"
