[package]
name = "hlas"
version = "0.2.0"
edition = "2021"
description = "Ultra-minimal dictation for Windows. Hold a key, speak, release."
authors = ["Gedeon Drapak"]
license = "MIT"
repository = "https://github.com/GedeonDrapak/hlas-win"

[[bin]]
name = "hlas"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[features]
default = []
# Experimental GPU build: whisper.cpp on Vulkan (NVIDIA, AMD and Intel,
# including integrated graphics). Needs the Vulkan SDK at build time and
# vulkan-1.dll at run time, so it ships as a separate executable.
vulkan = ["whisper-rs/vulkan"]

# Platform-independent core: audio preparation, text rules, history, config.
# Everything here is unit-tested on any OS with `cargo test`.
[dependencies]
anyhow = "1"
log = "0.4"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
crossbeam-channel = "0.5"
# Resampling captured audio to 16 kHz mono
rubato = "0.16"
# Model integrity (same SHA-256 the macOS app checks)
sha2 = "0.10"
# Exact replacements (case-insensitive, whole words)
regex = "1"
# Local timestamps for history
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Audio file import (wav, mp3, m4a/aac, flac, ogg)
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }

[target.'cfg(windows)'.dependencies]
# Audio capture (WASAPI backend)
cpal = "0.15"
# Local Whisper (bundles whisper.cpp)
whisper-rs = { version = "0.16", default-features = false }
# Tray icon + menu
tray-icon = "0.19"
# Native Win32 GUI for settings, history, onboarding (no webview, tiny RAM)
native-windows-gui = { version = "1.0", features = ["high-dpi"] }
# Credential Manager storage for API keys. Without "windows-native" keyring
# silently falls back to an in-memory mock store and nothing persists.
keyring = { version = "3", features = ["windows-native"] }
# Cloud engines + Smart text
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
simplelog = "0.12"
# Registry access for launch-at-login and microphone privacy state
winreg = "0.52"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Console",
]

[build-dependencies]
embed-resource = "2.4"

[patch.crates-io]
# whisper-rs-sys 0.15.0 omits its CMake install lib directory from Rust's link
# search path on Windows. Keep the one-line upstream fix local until released.
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }
